name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' package no longer exists in the SDK repo (sdkmanager exits 1);
          # platform-tools is all this step needs — real packages are installed next.
          packages: platform-tools

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JS dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK with EAS (local build on this runner)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile preview --local --non-interactive \
            --output "${{ runner.temp }}/caw-social.apk"
          test -s "${{ runner.temp }}/caw-social.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: caw-social-apk
          path: ${{ runner.temp }}/caw-social.apk
          if-no-files-found: error

      # Google Play deliverable: same code, production EAS profile
      # (buildType app-bundle). EAS keeps ONE Android keystore per
      # project, so the AAB is signed with the same key as the APK
      # above — Play App Signing enrollment stays consistent.
      - name: Build AAB with EAS (local build on this runner)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile production --local --non-interactive \
            --output "${{ runner.temp }}/caw-social.aab"
          test -s "${{ runner.temp }}/caw-social.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: caw-social-aab
          path: ${{ runner.temp }}/caw-social.aab
          if-no-files-found: error
